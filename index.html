<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片画廊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #1d1d1f;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .card .label {
            padding: 14px 16px;
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 4px 40px rgba(0,0,0,0.5);
        }
        .lightbox .caption {
            color: #fff;
            margin-top: 16px;
            font-size: 16px;
            opacity: 0.8;
        }
        .lightbox .close {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
            opacity: 0.7;
            line-height: 1;
        }
        .lightbox .close:hover { opacity: 1; }
        .lightbox .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 48px;
            cursor: pointer;
            opacity: 0.6;
            user-select: none;
            padding: 20px;
        }
        .lightbox .nav:hover { opacity: 1; }
        .lightbox .prev { left: 10px; }
        .lightbox .next { right: 10px; }
    </style>
</head>
<body>
    <h1>📷 我的图片画廊</h1>
    <p style="text-align:center; margin-bottom:20px;">
        <a href="/quiz" style="display:inline-block; padding:10px 24px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border-radius:20px; text-decoration:none; font-weight:600; font-size:15px;">🧮 去口算练习</a>
    </p>
    <div class="gallery" id="gallery"></div>

    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <span class="nav prev" onclick="navigate(-1)">&#10094;</span>
        <img id="lightboxImg" src="" alt="">
        <span class="nav next" onclick="navigate(1)">&#10095;</span>
        <div class="caption" id="lightboxCaption"></div>
    </div>

    <script>
        var images = [
            { src: "images/photo1.jpg", label: "桌面日常" },
            { src: "images/photo2.jpg", label: "拼多多订单" },
            { src: "images/photo3.jpg", label: "天气小部件" },
            { src: "images/photo4.jpg", label: "Apple Music专辑" }
        ];

        var gallery = document.getElementById("gallery");
        images.forEach(function(img, i) {
            var card = document.createElement("div");
            card.className = "card";
            card.innerHTML = '<img src="' + img.src + '" alt="' + img.label + '"><div class="label">' + img.label + '</div>';
            card.onclick = function() { openLightbox(i); };
            gallery.appendChild(card);
        });

        var currentIndex = 0;
        var lightbox = document.getElementById("lightbox");
        var lightboxImg = document.getElementById("lightboxImg");
        var lightboxCaption = document.getElementById("lightboxCaption");

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add("active");
            document.body.style.overflow = "hidden";
        }
        function closeLightbox() {
            lightbox.classList.remove("active");
            document.body.style.overflow = "";
        }
        function navigate(dir) {
            currentIndex = (currentIndex + dir + images.length) % images.length;
            updateLightbox();
        }
        function updateLightbox() {
            lightboxImg.src = images[currentIndex].src;
            lightboxCaption.textContent = images[currentIndex].label + " (" + (currentIndex+1) + "/" + images.length + ")";
        }

        lightbox.addEventListener("click", function(e) {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener("keydown", function(e) {
            if (!lightbox.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") navigate(-1);
            if (e.key === "ArrowRight") navigate(1);
        });
    </script>
</body>
</html>
