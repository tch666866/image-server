<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口算练习</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .question {
            font-size: 44px;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .answer-input {
            width: 100%;
            padding: 16px;
            font-size: 28px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }
        .answer-input:focus {
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.next { background: linear-gradient(135deg, #4ecdc4, #44bd9e); margin-top: 12px; }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 600;
            min-height: 28px;
        }
        .result.ok { color: #2ecc71; }
        .result.no { color: #e74c3c; }

        .stats {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed #e0e0e0;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            color: #666;
        }
        .stats .num { font-size: 22px; font-weight: 700; color: #333; display: block; }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
        }
        .back:hover { color: #667eea; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🧮 口算练习</h1>
        <div class="subtitle">两位数加减法 · 算法来自 bblb02.java</div>

        <div class="question" id="question">加载中...</div>

        <input class="answer-input" id="answer" type="number" placeholder="输入你的答案" autofocus>
        <button class="btn" id="submitBtn" onclick="submitAnswer()">提交答案</button>
        <button class="btn next" id="nextBtn" style="display:none" onclick="loadQuestion()">下一题</button>

        <div class="result" id="result"></div>

        <div class="stats">
            <div>总答题 <span class="num" id="total">0</span></div>
            <div>正确 <span class="num" id="correct">0</span></div>
            <div>错误 <span class="num" id="wrong">0</span></div>
            <div>准确率 <span class="num" id="rate">0%</span></div>
        </div>

        <a class="back" href="/">← 返回图片画廊</a>
    </div>

    <script>
        var currentId = 0;
        var submitted = false;

        // 加载一道新题（调用 Java 后端 /api/quiz/new）
        function loadQuestion() {
            fetch('/api/quiz/new')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    currentId = data.id;
                    document.getElementById('question').textContent =
                        data.x + ' ' + data.op + ' ' + data.y + ' = ?';
                    document.getElementById('answer').value = '';
                    document.getElementById('result').textContent = '';
                    document.getElementById('result').className = 'result';
                    document.getElementById('submitBtn').style.display = 'block';
                    document.getElementById('nextBtn').style.display = 'none';
                    document.getElementById('answer').disabled = false;
                    document.getElementById('submitBtn').disabled = false;
                    submitted = false;
                    document.getElementById('answer').focus();
                });
        }

        // 提交答案（调用 Java 后端 /api/quiz/check）
        function submitAnswer() {
            if (submitted) return;
            var answer = document.getElementById('answer').value;
            if (answer === '') { alert('请输入答案！'); return; }

            submitted = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('answer').disabled = true;

            fetch('/api/quiz/check?id=' + currentId + '&answer=' + answer)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var result = document.getElementById('result');
                    if (data.correct) {
                        result.textContent = '✅ 正确！';
                        result.className = 'result ok';
                    } else {
                        result.textContent = '❌ 错误';
                        result.className = 'result no';
                    }
                    document.getElementById('total').textContent = data.total;
                    document.getElementById('correct').textContent = data.correctCount;
                    document.getElementById('wrong').textContent = data.wrongCount;
                    document.getElementById('rate').textContent = data.rate + '%';
                    document.getElementById('nextBtn').style.display = 'block';
                });
        }

        // 回车键提交
        document.getElementById('answer').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (!submitted) submitAnswer();
                else loadQuestion();
            }
        });

        // 页面加载时先出第一题
        loadQuestion();
    </script>
</body>
</html>
